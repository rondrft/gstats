name = "phosphor-stats"
main = "src/index.ts"
compatibility_date = "2026-07-01"

# `nodejs_compat` is deliberately NOT enabled. The Worker has zero runtime
# dependencies and uses only Web Platform APIs, which keeps the bundle small
# and the cold path predictable.

[observability]
enabled = true

# Cached GitHub responses. Create with:
#   wrangler kv namespace create STATS_CACHE
#   wrangler kv namespace create STATS_CACHE --preview
# then paste the returned ids below. The ids are not secrets.
[[kv_namespaces]]
binding = "STATS_CACHE"
id = "073f428dd72448d19a9063f087274b2e"
preview_id = "57d7366d6d83441abf4cadd1344d2e2c"

[vars]
# Identifies the running build. Reported by /health, and mixed into the cache key
# so that a deploy starts from an empty cache instead of reading entries written
# by the previous release.
#
# This value is only the local-development fallback. Real deploys override it
# with the commit they were built from:
#
#   wrangler deploy --var SERVICE_VERSION:$(git rev-parse --short HEAD)
#
# which `pnpm deploy` and the deploy workflow both do.
SERVICE_VERSION = "dev"

# GITHUB_TOKEN is a secret and must never appear here. Set it with:
#   wrangler secret put GITHUB_TOKEN
