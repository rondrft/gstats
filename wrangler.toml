name = "phosphor-stats"
main = "src/index.ts"
compatibility_date = "2026-07-01"

# `nodejs_compat` is deliberately NOT enabled. The Worker has zero runtime
# dependencies and uses only Web Platform APIs, which keeps the bundle small
# and the cold path predictable.

[observability]
enabled = true

# Cache warming. Fires every fifteen minutes and returns immediately unless
# WARM_USERS names somebody, so an instance that did not ask for it pays one
# no-op invocation per interval and makes no requests and no writes.
[triggers]
crons = ["*/15 * * * *"]

# Per-address limiting on /api, enforced inside the Worker.
#
# This is deliberately not a WAF rate limiting rule. Those are configured per
# zone, and the default deployment target — a workers.dev subdomain — is not a
# zone anybody but Cloudflare can add rules to, so the rule this project's docs
# used to recommend could not actually be created. This binding needs no zone.
#
# `limit` is a token budget per address per minute, not a request count. The
# platform fixes `period` at 10 or 60 seconds and gives the Worker no way to read
# `limit` back at runtime, so the request limit is set with the API_RATE_LIMIT
# variable below and each request spends `limit / API_RATE_LIMIT` tokens. Keep
# this in step with RATE_LIMIT_TOKENS_PER_MINUTE in src/ratelimit.ts.
#
# namespace_id is a local identifier for the counter, not an account resource,
# and it is not a secret.
[[ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "1"

  [ratelimits.simple]
  limit = 60
  period = 60

# Cached GitHub responses. Create with:
#   wrangler kv namespace create STATS_CACHE
#   wrangler kv namespace create STATS_CACHE --preview
# then paste the returned ids below. The ids are not secrets.
[[kv_namespaces]]
binding = "STATS_CACHE"
id = "073f428dd72448d19a9063f087274b2e"
preview_id = "57d7366d6d83441abf4cadd1344d2e2c"

[vars]
# Identifies the running build. Reported by /health, and mixed into the cache key
# so that a deploy starts from an empty cache instead of reading entries written
# by the previous release.
#
# This value is only a fallback for `wrangler dev` invoked directly. Both
# `pnpm dev` and `pnpm deploy` override it with the commit they are running,
# because a constant here means every local session shares one cache namespace
# for ever — and an entry written before a change to how a field is computed
# would be read back after it.
#
# The durable protection is `SCHEMA_VERSION` in src/cache.ts, which is part of
# the same key and does not depend on the environment. Bump that when the
# meaning of a stored field changes.
SERVICE_VERSION = "dev-local"

# How long a client may reuse a rendered card, in seconds. Clamped to 1800-86400.
#
# This is not the same lever as how long the service holds your figures, and
# they cost different things. A revalidation arriving after this lapses is
# answered from KV without touching GitHub, so lowering it spends Worker
# invocations; how often GitHub is asked is set by KV_FRESH_SECONDS in
# src/cache.ts and spends the shared hourly quota. Raise this on a busy
# instance with `--var CARD_MAX_AGE:3600`.
CARD_MAX_AGE = "1800"

# Requests per minute per address on /api, cache hits included. Thirty is far
# above what a README ever generates — a card is one request every half hour per
# reader — and far below what enumerating logins needs.
#
# The ceiling is the token budget declared under [[ratelimits]] above. Values
# that do not divide it round down to the nearest achievable limit, which is the
# safe direction. Raising it past the budget means raising the budget too.
API_RATE_LIMIT = "30"

# Distinct logins per hour per address on /api. This is the limit that separates
# a reader from a scraper: a reader loads one or two profiles, a scraper walks
# hundreds, and every login it has not seen before is a guaranteed cache miss
# and three to five upstream queries.
PROFILE_RATE_LIMIT = "20"

# Daily KV write allowance to measure against at /health. The default is the
# free plan's; a Workers Paid instance should set this to 1000000 so that the
# percentage means something.
KV_WRITE_BUDGET = "1000"

# Logins to keep permanently warm, comma separated, at most ten. Every fifteen
# minutes each one is refetched and written back to KV, so nobody visiting those
# profiles ever waits on GitHub and the stored figures are never more than a
# quarter of an hour old.
#
# Empty by default. Read docs/purging.md before adding more than a couple: the
# GitHub cost is negligible but the KV writes are not, against a free plan that
# allows a thousand a day.

# Secrets, which must never appear here. Set them with:
#   wrangler secret put GITHUB_TOKEN   # required
#   wrangler secret put PURGE_TOKEN    # optional, enables POST /purge
