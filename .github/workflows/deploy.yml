name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys race for the same Worker.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only the repository that owns the public instance should publish. A fork
    # that wants continuous deployment removes this line and adds its own
    # CLOUDFLARE_API_TOKEN secret.
    if: github.repository == 'rondrft/phosphor-stats'
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The same gate as CI. A deploy should never be the first place a failure
      # shows up.
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
