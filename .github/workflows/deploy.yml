name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys race for the same Worker.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # Secrets are not readable from a job-level `if`, so the check has to happen
  # inside a job. Without it, a clone that has not set up Cloudflare yet would
  # get a red X on every push to main for a deploy it never asked for.
  guard:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN is not set. Skipping deploy — see docs/self-hosting.md."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: guard
    if: needs.guard.outputs.configured == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The same gate as CI. A deploy should never be the first place a failure
      # shows up.
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      # The short commit, so /health can be compared against `git log` by eye.
      # `github.sha` is the full 40 characters and `pnpm deploy` uses
      # `rev-parse --short`; two formats for one identifier is one too many.
      - id: build
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # The commit becomes the build identifier: it labels the instance at
      # /health and namespaces the cache, so the release does not read entries
      # written by its predecessor.
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --env="" --var SERVICE_VERSION:${{ steps.build.outputs.sha }}

      # The old hostname, serving the same code so that no published card URL
      # ever breaks. See [env.legacy] in wrangler.toml for why this is a second
      # deploy rather than a redirect.
      #
      # The same SERVICE_VERSION as the step above, deliberately: it is part of
      # the cache key, so passing the same value is what lets the two Workers
      # share entries instead of each paying its own misses out of one KV write
      # budget. Two steps rather than one `&&` so that a failure names which
      # hostname it was.
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --env legacy --var SERVICE_VERSION:${{ steps.build.outputs.sha }}
