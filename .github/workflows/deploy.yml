name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys race for the same Worker.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # Secrets are not readable from a job-level `if`, so the check has to happen
  # inside a job. Without it, a clone that has not set up Cloudflare yet would
  # get a red X on every push to main for a deploy it never asked for.
  guard:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN is not set. Skipping deploy — see docs/self-hosting.md."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: guard
    if: needs.guard.outputs.configured == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The same gate as CI. A deploy should never be the first place a failure
      # shows up.
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      # The commit becomes the build identifier: it labels the instance at
      # /health and namespaces the cache, so the release does not read entries
      # written by its predecessor.
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --var SERVICE_VERSION:${{ github.sha }}
